events { 
    # 🎯 NÂNG TRẦN: Nâng tối đa kết nối để cân trọn bộ luồng vào/ra của 6000+ VUs
    worker_connections 16384; 
}

http {
    upstream nestjs_cluster {
        server nestjs-app:3001; 
    }

    server {
        listen 80;

        # 🎯 TỐI ƯU HTTP KEEPALIVE: Giảm thời gian ngâm kết nối lâu trên RAM
        keepalive_timeout 15s;
        keepalive_requests 1000;

        location / {
            proxy_pass http://nestjs_cluster;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Tinh chỉnh lại bộ đệm tránh nghẽn dòng dữ liệu lớn
            proxy_buffering on;
            proxy_buffers 16 16k;
            proxy_buffer_size 32k;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}