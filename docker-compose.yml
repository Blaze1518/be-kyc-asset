services:
  postgres-db:
    image: postgres:15-alpine
    container_name: be-kyc-asset-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '${DB_PORT:-5432}:5432'
    command:
      [
        'postgres',
        '-c',
        'max_connections=200',
        '-c',
        'shared_buffers=256MB',
        '-c',
        'work_mem=8MB',
        '-c',
        'maintenance_work_mem=64MB',
      ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kyc-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1GB

  pgadmin:
    image: dpage/pgadmin4
    container_name: be-kyc-asset-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - '5051:80'
    networks:
      - kyc-network
    depends_on:
      - postgres-db

  redis:
    image: redis:7-alpine
    container_name: be-kyc-asset-redis
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: >
      redis-server 
      --requirepass '${REDIS_PASSWORD}'
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command KEYS ""
    volumes:
      - redis_data:/data
    networks:
      - kyc-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1GB

  redisinsight:
    image: redis/redisinsight:latest
    container_name: be-kyc-asset-redisinsight
    restart: always
    ports:
      - '5540:5540'
    volumes:
      - redisinsight_data:/data
    networks:
      - kyc-network
    depends_on:
      - redis

  nestjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3001}
      - GLOBAL_PREFIX=${GLOBAL_PREFIX:-api/v1}
      - APP_NAME=${APP_NAME}

      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN}
      - REFRESH_TOKEN_TTL_DAYS=${REFRESH_TOKEN_TTL_DAYS}
      - AUTH_REFRESH_GRACE_PERIOD_SECONDS=${AUTH_REFRESH_GRACE_PERIOD_SECONDS}

      - DB_TYPE=${DB_TYPE}
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}

      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres-db:5432/${DB_DATABASE}?schema=public
    networks:
      - kyc-network
    depends_on:
      - postgres-db
      - redis
    deploy:
      mode: replicated
      replicas: 4
      resources:
        limits:
          cpus: '1.0'
          memory: 1GB

  nginx-lb:
    image: nginx:alpine
    container_name: be-kyc-asset-nginx
    restart: always
    ports:
      - '3001:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - kyc-network
    depends_on:
      - nestjs-app

networks:
  kyc-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
